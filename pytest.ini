[pytest]
minversion = 8.0
testpaths = backend/tests scraper/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = .
addopts = --import-mode=importlib -v
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.testclient.StarletteDeprecationWarning
